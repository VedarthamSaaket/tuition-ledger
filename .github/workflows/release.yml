name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tuition_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tuition_ledger_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: python -m ledger all --profile starter --out data/release
      - run: python -m ledger reproduce --profile starter --report data/release/reproducibility.json
      - run: tar -czf starter-dataset.tar.gz -C data/release .
      - run: tar -czf frontend-build.tar.gz -C frontend/dist .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            starter-dataset.tar.gz
            frontend-build.tar.gz
